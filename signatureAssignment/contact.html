<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Birds of Prey Lacrosse</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <!-- Insert brand logo image here: replace the src with your logo file -->
            <img src="media/logo.png" alt="Birds of Prey Lacrosse Logo" class="logo">
            <h1>Birds of Prey Lacrosse</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>Have a question about a product, a team order, or just want to get in touch? Fill out the form below and we will get back to you shortly.</p>
        </section>

        <section class="form-section">
            <div id="form-message"></div>

            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="text" id="email" placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label>I am interested in: (select all that apply)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="check-equipment" value="Equipment"> Equipment</label>
                    <label><input type="checkbox" id="check-apparel" value="Apparel"> Apparel</label>
                    <label><input type="checkbox" id="check-team" value="Team Orders"> Team Orders</label>
                    <label><input type="checkbox" id="check-sponsorship" value="Sponsorship"> Sponsorship Inquiry</label>
                </div>
            </div>

            <div class="form-group">
                <label>How did you hear about us?</label>
                <div class="radio-group">
                    <label><input type="radio" name="referral" value="Social Media"> Social Media</label>
                    <label><input type="radio" name="referral" value="Friend or Teammate"> Friend or Teammate</label>
                    <label><input type="radio" name="referral" value="Search Engine"> Search Engine</label>
                    <label><input type="radio" name="referral" value="Other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="5" placeholder="Type your message here"></textarea>
            </div>

            <div class="form-buttons">
                <button type="button" onclick="submitForm()">Submit</button>
                <button type="button" onclick="resetForm()">Reset</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Birds of Prey Lacrosse - Griffin and Zack</p>
        <p>IT105 - Principles of Programming</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
